# 单轮行程生成。只保留 runner 真读、或明确标注“仅声明”的字段。
name: travel-plan-single-turn
version: 3
suite: single_turn

dataset:
  path: evaluation/product_cases.json
  split: test
  cases: 120

judge:
  model: deepseek-v4-flash
  status: implemented

graders:
  - id: hard_constraints
    type: constraint_set
    status: implemented
    path: product/constraints/sets/v1.json
    severity: blocking
    weight: 0.6
    threshold: 1.0
    assertions:
      - {id: complete, text: "状态为 complete；该追问的用例必须追问"}
      - {id: day_count, text: "天数与需求一致"}
      - {id: density, text: "每天活动数符合节奏与可用时长"}
      - {id: time_order, text: "开始时间严格递增"}
      - {id: no_overlap, text: "活动与用餐时间不重叠"}
      - {id: day_load, text: "单日总时长不超过可用时长"}
      - {id: unique_titles, text: "跨天不重复同一地点"}
      - {id: title_clean, text: "标题不含攻略/门票/图片等噪声词"}
      - {id: title_matches_evidence, text: "标题落在证据地点名上"}
      - {id: city_coverage, text: "覆盖用户点名的城市"}
      - {id: evidence_ok, text: "每个活动都绑定 ok 证据"}
      - {id: periods, text: "覆盖至少两个时段"}
      - {id: activity_length, text: "单活动时长落在节奏区间"}
      - {id: free_time, text: "留白比例落在节奏区间"}
      - {id: no_fabricated_cost, text: "价格数字来自证据"}
      - {id: opening_hours, text: "排期落在营业时间内"}
      - {id: named_places_covered, text: "用户点名地点全部出现"}
      - {id: fields_filled, text: "时间/时长/交通/费用非空"}
      - {id: meal_grounded, text: "餐饮名对得上证据"}
      - {id: anchor_satisfied, text: "锚定 food/stay 时槽位齐全"}

  - id: plan_quality
    type: llm_rubric
    status: implemented
    rubric: evaluation/rubrics/plan_quality.md
    severity: scored
    weight: 0.4
    threshold: 0.7
    assertions:
      - {id: c1, text: "每个活动写了开始时间与停留时长"}
      - {id: c2, text: "每个活动写了具体做什么，不是空话"}
      - {id: f1, text: "同一天转场时间走得通"}
      - {id: f2, text: "单日不超可用时长，没有硬塞"}
      - {id: p1, text: "用户提到的偏好都有对应安排"}
      - {id: p2, text: "用户排除的地点没有出现"}
      - {id: b1, text: "未核实的价格/时间/班次明确标注"}
      - {id: b2, text: "没有编造证据外的价格/时间/评分", weight: 3, veto: true}
      - {id: r1, text: "不同日期活动有明显差异"}
      - {id: r2, text: "每天有主次，不是原样堆满"}

  # 以下三项 runner 尚未执行，显式标注，避免配置看起来比实现强。
  - id: state_check
    type: state_check
    status: declared
    assertions:
      - {id: status, text: "状态在 complete/needs_clarification/partial 之内"}
      - {id: clarify_empty, text: "追问时 days 为空且 question 非空"}
    note: 未单列执行；complete 由 hard_constraints 覆盖，其余留待接入

  - id: tool_calls
    type: tool_calls
    status: declared
    assertions:
      - {id: poi_per_day, text: "每天至少一次 poi 查询"}
      - {id: named_queried, text: "点名地点出现在查询词里"}
    note: 证据绑定已限制“没查过的地点进不来”，过程断言暂不单独执行

  - id: transcript
    type: transcript
    status: declared
    assertions:
      - {id: turns, text: "单次任务不超过 60 回合"}

thresholds:
  score_min: 0.80
  deliverable: {rubric_min: 0.7, status: declared}
