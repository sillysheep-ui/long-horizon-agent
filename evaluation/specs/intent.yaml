# 意图路由：只判分类，不看行程。
name: travel-plan-intent
version: 2
suite: intent
dataset: {path: evaluation/intent_holdout.json, cases: 40}

graders:
  - id: classification
    type: state_check
    status: implemented
    threshold: 1.0
    assertions:
      - {id: label, text: "预测意图是五类之一"}
      - {id: expect, text: "预测意图等于标注意图"}

thresholds:
  final_accuracy: 0.95
  fallback_rate_max: 0.40
