# 沙盒离线评测：固定 10 城数据，只跑硬约束。
name: travel-plan-sandbox
version: 2
suite: sandbox
dataset: {path: evaluation/product_cases.json, split: test, cases: 36}
judge: {enabled: false, status: declared}

graders:
  - id: hard_constraints
    type: constraint_set
    status: implemented
    path: product/constraints/sets/v1.json
    severity: blocking
    threshold: 1.0
    assertions:
      - {id: opening_hours, text: "排期落在沙盒营业时间内"}
      - {id: no_fabricated_cost, text: "价格来自沙盒 price 字段"}
      - {id: named_places_covered, text: "点名地点全部出现"}
      - {id: evidence_ok, text: "每个活动绑定沙盒证据"}

thresholds:
  score_min: null
