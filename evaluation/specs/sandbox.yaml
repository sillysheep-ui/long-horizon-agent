# 沙盒离线评测：固定 10 城数据，可复现，不依赖外网。
name: travel-plan-sandbox
version: 1
suite: sandbox
description: 用 ChinaTravel 沙盒替换 POI 数据源，只测单次生成的结构与事实约束。

dataset:
  path: evaluation/product_cases.json
  split: test
  filters: {pool: sandbox}     # 用例城市 ⊆ 沙盒 10 城
  cases: 36

environment:
  model_profile: api_only
  poi_provider: sandbox
  sandbox_dir: data/sandbox
  seed: 7

judge:
  enabled: false               # 先跑硬约束；需要 rubric 时再打开
  model: deepseek-v4-flash

graders:
  - id: hard_constraints
    type: constraint_set
    path: product/constraints/sets/v1.json
    severity: blocking
    threshold: 1.0
    assertions:
      - {id: opening_hours, text: "排期落在沙盒营业时间内"}
      - {id: no_fabricated_cost, text: "价格来自沙盒 price 字段"}
      - {id: named_places_covered, text: "点名地点全部出现"}
      - {id: evidence_ok, text: "每个活动绑定沙盒证据"}

tracked_metrics:
  - {type: latency, metrics: [latency_mean, stage_latency_mean]}

thresholds:
  score_min: null              # 沙盒没有 rubric 分，只看硬约束
