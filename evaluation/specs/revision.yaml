# 多轮修改：先规划，再改某一天，检查“只改了该改的”。
name: travel-plan-revision
version: 1
suite: revision
description: 定向修改的保留与生效判定。

dataset:
  path: evaluation/product_revision_cases.json
  cases: 30

environment:
  model_profile: api_only
  seed: 7

graders:
  - id: revision_checks
    type: state_check
    threshold: 1.0
    assertions:
      - {id: kept_days, text: "非目标日的活动原样保留（容忍本馆/新馆后缀）"}
      - {id: target_changed, text: "目标日确实发生了变化"}
      - {id: applied, text: "targeted 用例 revision_applied=true；full 用例为 null"}
      - {id: day_count, text: "修改前后天数一致"}
      - {id: evidence_ok, text: "新活动仍绑定 ok 证据"}
      - {id: time_order, text: "修改后时间仍递增"}

  - id: intent_route
    type: tool_calls
    required:
      - {tool: revision_eval, max_rounds: 2}
    note: 多轮走两次任务，不调外部工具

tracked_metrics:
  - type: latency
    metrics: [first_elapsed_mean, revision_elapsed_mean]

thresholds:
  all_passed: 1.0
