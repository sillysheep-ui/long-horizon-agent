name: Eval smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com
      JUDGE_MODEL_ID: deepseek-v4-flash
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no key
        if: env.HAS_KEY == ''
        run: echo "未配置 DEEPSEEK_API_KEY，跳过评测 smoke；接入方式见 docs/EVAL_PLAN.md。"
      - uses: actions/setup-python@v5
        if: env.HAS_KEY != ''
        with:
          python-version: "3.12"
      - name: Install eval dependencies
        if: env.HAS_KEY != ''
        run: python -m pip install fastapi httpx python-dotenv openai
      - name: Run regression suite (dev 12, 2 trials)
        if: env.HAS_KEY != ''
        run: |
          python -m evaluation.product_eval \
            --profile api_only --spec evaluation/specs/regression.yaml \
            --seed 7 --trials 2 --skip-judge \
            --db /tmp/eval-regression.db --out results/ci-eval \
            --min-pass-rate 1.0
      - name: Combined report
        if: env.HAS_KEY != ''
        run: python -m evaluation.combined --dir results --out results/combined.md
      - name: Upload report
        if: always() && env.HAS_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            results/ci-eval
            results/combined.md
          if-no-files-found: ignore
