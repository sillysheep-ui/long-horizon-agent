name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest numpy fastapi httpx python-dotenv openai ruff==0.17.5
      - name: Lint Python files
        run: python -m ruff check .
      - name: Compile Python files
        run: |
          python -m compileall -q inference prompts tools utils data_pipeline evaluation training tests product scripts
      - name: Run lightweight tests
        run: |
          python -m pytest -q \
            tests/test_baseline_metrics.py \
            tests/test_build_agent_prm_counterfactuals.py \
            tests/test_build_agent_prm_dataset.py \
            tests/test_build_agent_prm_preference_pairs.py \
            tests/test_build_hard_agent_tasks.py \
            tests/test_geo.py \
            tests/test_judge_tool_dag.py \
            tests/test_tool_dag.py \
            tests/test_tool_verifier.py \
            tests/test_product_answer_filter.py \
            tests/test_product_cases.py \
            tests/test_product_checks.py \
            tests/test_product_conversations.py \
            tests/test_product_clarify_flow.py \
            tests/test_product_coverage.py \
            tests/test_product_judge.py \
            tests/test_product_names.py \
            tests/test_product_planner.py \
            tests/test_product_provenance.py \
            tests/test_product_revision.py \
            tests/test_product_tool_adapters.py \
            tests/test_revision_checks.py \
            tests/test_tools_web.py \
            tests/test_tool_web_search.py \
            tests/test_stage_checks.py \
            tests/test_codex_task.py \
            tests/test_text_utils.py \
            tests/test_product_geo.py \
            tests/test_product_intent.py \
            tests/test_product_intent_model.py \
            tests/test_product_intent_scope.py \
            tests/test_product_memory.py \
            tests/test_product_profile.py \
            tests/test_product_revision_idempotency.py \
            tests/test_product_transit.py \
            tests/test_product_pace.py \
            tests/test_product_schedule.py \
            tests/test_examples.py \
            tests/test_around_search.py \
            tests/test_build_opd_state_dataset.py \
            tests/test_travel_multi_turn_scheduler.py
