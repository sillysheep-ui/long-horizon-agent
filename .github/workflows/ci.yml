name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Compile Python files
        run: |
          python -m compileall -q inference prompts tools utils data_pipeline evaluation training tests
      - name: Run lightweight tests
        run: |
          python -m pytest -q \
            tests/test_baseline_metrics.py \
            tests/test_geo.py \
            tests/test_judge_tool_dag.py \
            tests/test_tool_dag.py \
            tests/test_tool_verifier.py
